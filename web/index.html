<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07080d" />
  <title>Nova</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="icon-btn" id="toggleSide" title="Chats">≡</button>
      <div class="mark" aria-hidden="true"></div>
      <div class="titles">
        <h1>NOVA</h1>
        <p id="chatTitle">Local · on this device</p>
      </div>
      <span class="status" id="status">offline brain</span>
      <div class="train-wrap">
        <button type="button" class="train-btn" id="trainBtn" title="Train until you stop">Train</button>
        <button type="button" class="icon-btn menu-btn" id="brainMenuBtn" title="Brain menu" aria-haspopup="true">⋮</button>
        <div class="brain-menu" id="brainMenu" hidden>
          <button type="button" data-act="toggle">Start training</button>
          <button type="button" data-act="sample">Sample</button>
          <button type="button" data-act="status">Train status</button>
          <button type="button" data-act="export">Export brain</button>
        </div>
      </div>
      <button class="icon-btn" id="newChat" title="New chat">+</button>
    </header>
    <div class="shell">
      <aside class="side" id="side" hidden>
        <p class="side-label">Chats</p>
        <div id="chatList"></div>
      </aside>
      <main class="feed" id="feed"></main>
    </div>
    <form class="composer" id="form">
      <button type="button" class="mic" id="mic" title="Speak">mic</button>
      <textarea id="draft" rows="1" placeholder="Talk to Nova" enterkeyhint="send"></textarea>
      <button type="submit" class="send" title="Send">↑</button>
    </form>
  </div>
  <script src="idb.js?v=20"></script>
  <script src="https://cdn.jsdelivr.net/gh/wolfplayz07/Nova-AI@f131f1e7527df2650388cf960c9082126523e215/web/train.js"></script>
  <script src="lookup.js?v=20"></script>
  <script src="fetch.js?v=20"></script>
  <script src="app.js?v=20"></script>
  <script src="math-boot.js?v=20"></script>
</body>
</html>
