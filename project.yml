name: NovaAI
options:
  bundleIdPrefix: com.wolfplayz07
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  NovaAI:
    type: application
    platform: iOS
    sources:
      - NovaAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfplayz07.NovaAI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nova
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
